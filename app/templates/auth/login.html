{% extends 'base.html' %}
{% block title %}Masuk - ThriftMarket{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-slate-200 rounded-2xl shadow-sm">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-900">Selamat Datang</h2>
        <p class="text-sm text-slate-500 mt-1">Masuk ke akun ThriftMarket Anda</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email</label>
            <input type="email" name="email" required placeholder="nama@email.com"
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Kata Sandi</label>
            <input type="password" name="password" required placeholder="••••••••"
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm">
        </div>

        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition">
            Masuk
        </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
        Belum punya akun? <a href="{{ url_for('auth.register') }}" class="text-blue-600 font-semibold hover:underline">Daftar Sekarang</a>
    </p>
</div>
{% endblock %}
