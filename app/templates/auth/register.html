{% extends 'base.html' %}
{% block title %}Daftar Akun - ThriftMarket{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-slate-200 rounded-2xl shadow-sm">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-900">Buat Akun Baru</h2>
        <p class="text-sm text-slate-500 mt-1">Mulai jual beli barang bekas terpercaya</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nama Lengkap</label>
            <input type="text" name="name" required placeholder="Contoh: Budi Santoso"
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Email</label>
            <input type="email" name="email" required placeholder="nama@email.com"
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Kata Sandi</label>
            <input type="password" name="password" required placeholder="Minimal 6 karakter"
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-2">Daftar Sebagai</label>
            <div class="grid grid-cols-2 gap-3">
                <label class="flex flex-col p-3 border rounded-xl cursor-pointer hover:border-blue-500 transition text-center has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
                    <input type="radio" name="role" value="buyer" checked class="hidden">
                    <span class="text-sm font-bold text-slate-800">Pembeli</span>
                    <span class="text-[11px] text-slate-500">Cari barang bekas</span>
                </label>
                <label class="flex flex-col p-3 border rounded-xl cursor-pointer hover:border-blue-500 transition text-center has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50/50">
                    <input type="radio" name="role" value="seller" class="hidden">
                    <span class="text-sm font-bold text-slate-800">Penjual / Pemasar</span>
                    <span class="text-[11px] text-blue-600 font-medium">+ Jasa Antar</span>
                </label>
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Nomor WhatsApp / HP</label>
            <input type="text" name="phone" placeholder="08xxxxxxxxxx"
                class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm">
        </div>

        <div>
            <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Alamat Domisili</label>
            <textarea name="address" rows="2" placeholder="Alamat pengiriman / base penjemputan barang"
                class="w-full px-3.5 py-2 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm"></textarea>
        </div>

        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition">
            Daftar Sekarang
        </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-6">
        Sudah punya akun? <a href="{{ url_for('auth.login') }}" class="text-blue-600 font-semibold hover:underline">Masuk</a>
    </p>
</div>
{% endblock %}
